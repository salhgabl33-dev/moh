<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="cache-control" content="no-store">
  <meta http-equiv="pragma" content="no-cache">
  $(if var == "")
  <meta http-equiv="refresh" content="0; url=index.html?portal=error&amp;error=$(error-esc)">
  $(endif)
  <title>بوابة الشبكة · تعذر إتمام الطلب</title>
</head>
<body>
  <div id="router-response" data-action="onLoginError"
    data-logged-in="$(logged-in)"
    data-login-url="$(link-login-only-esc)"
    data-status-url="$(link-status-esc)"
    data-logout-url="$(link-logout-esc)"
    data-dst="$(link-orig-esc)"
    data-error="$(error-esc)">
  </div>
  <p>تعذر إتمام طلب الاتصال. يرجى العودة إلى بوابة الشبكة والمحاولة مجدداً.</p>
  <p><a href="index.html">العودة إلى صفحة الشبكة</a></p>
</body>
</html>
