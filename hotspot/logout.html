<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="cache-control" content="no-store">
  <meta http-equiv="pragma" content="no-cache">
  $(if var == "")
  <meta http-equiv="refresh" content="0; url=index.html?portal=logout">
  $(endif)
  <title>بوابة الشبكة · تم تسجيل الخروج</title>
</head>
<body>
  <div id="router-response" data-action="onLoggedOut"
    data-logged-in="$(logged-in)"
    data-login-url="$(link-login-only-esc)"
    data-status-url="$(link-status-esc)"
    data-logout-url="$(link-logout-esc)"
    data-dst="$(link-orig-esc)"
    data-username="$(username-esc)"
    data-ip="$(ip-esc)"
    data-domain="$(domain-esc)"
    data-bytes-in="$(bytes-in)"
    data-bytes-out="$(bytes-out)"
    data-remaining-data="$(remain-bytes-total)"
    data-remaining-time="$(session-time-left-esc)"
    data-uptime="$(uptime-esc)">
  </div>
  <p>تم تسجيل الخروج من بوابة الشبكة.</p>
  <p><a href="index.html">العودة إلى تسجيل الدخول</a></p>
</body>
</html>
